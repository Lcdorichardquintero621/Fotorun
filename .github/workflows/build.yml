name: Compilar FotoRun (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear plataforma Android
        run: flutter create --platforms=android --project-name fotorun --org com.fotorun .

      - name: Añadir permisos
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml

      - name: Subir minSdk
        run: sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 24/" android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FotoRun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
