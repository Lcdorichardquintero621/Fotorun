name: fotorun
description: Encuentra personas en tus fotos y videos, y limpia duplicados.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.2.0
  google_mlkit_face_detection: ^0.11.0
  tflite_core: ^0.12.11
  image: ^4.2.0
  image_picker: ^1.1.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/mobilefacenet.tflite
